pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

// Fabric Loom adds a local remapped-mods repository at project level.
// Keep Gradle's default PREFER_PROJECT behavior so Loom can register it.
rootProject.name = 'clown-client'
