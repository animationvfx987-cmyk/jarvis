name: Build CLOWN CLIENT

on:
  push:
    paths:
      - "clown-client/**"
      - ".github/workflows/build-clown-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clown-client
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2"

      - name: Build Fabric mod
        run: gradle build --no-daemon --stacktrace

      - name: Verify distributable JAR exists
        run: test -f build/libs/clown-client-0.1.0.jar

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: clown-client-0.1.0
          path: clown-client/build/libs/clown-client-0.1.0.jar
          if-no-files-found: error
          retention-days: 14
